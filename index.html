<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>炀鉴·东亚史录 - 智能体交互实验</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
}

/* ===== 身份弹窗 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.modal {
  background: #fff; border-radius: 16px;
  padding: 32px 24px; width: 90%; max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.modal h2 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; text-align: center; }
.modal .subtitle { font-size: 13px; color: #999; text-align: center; margin-bottom: 24px; }
.modal label { font-size: 14px; color: #333; display: block; margin-bottom: 6px; font-weight: 500; }
.modal input {
  width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0;
  border-radius: 10px; font-size: 15px; margin-bottom: 16px;
  outline: none; transition: border-color 0.2s;
}
.modal input:focus { border-color: #4a6cf7; }
.modal .btn {
  width: 100%; padding: 13px; background: #4a6cf7;
  color: #fff; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.modal .btn:hover { background: #3b5de7; }
.modal .error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 8px; display: none; }

/* ===== 主页面 ===== */
.page {
  height: 100%;
  display: flex; flex-direction: column;
  max-width: 760px; margin: 0 auto;
  background: #fff;
}
.chat-header {
  padding: 12px 16px; background: #4a6cf7; color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.chat-header .title { font-size: 16px; font-weight: 600; }
.chat-header .user-info {
  font-size: 12px; opacity: 0.9; cursor: pointer;
  background: rgba(255,255,255,0.18);
  padding: 4px 10px; border-radius: 12px;
}
.notice-bar {
  background: #fff8e1; border-bottom: 1px solid #ffe082;
  padding: 10px 14px; font-size: 13px; color: #7a5c00;
  line-height: 1.6; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.notice-bar b { color: #4a3a00; }
.notice-bar .notice-close {
  flex-shrink: 0; border: none; background: #ffd54f; color: #5d4400;
  font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  white-space: nowrap;
}
#sdk-container {
  flex: 1; min-height: 0;
  width: 100%;
}
</style>
</head>
<body>

<!-- 身份弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>📋 身份确认</h2>
    <p class="subtitle">请输入你的信息开始对话</p>
    <label for="stuId">学生编号</label>
    <input type="text" id="stuId" placeholder="例：03" maxlength="4" autocomplete="off" inputmode="numeric">
    <label for="stuName">姓名拼音缩写</label>
    <input type="text" id="stuName" placeholder="例：zs（张三）" maxlength="6" autocomplete="off">
    <button class="btn" id="startBtn">开始对话</button>
    <p class="error" id="modalError">请填写完整信息</p>
  </div>
</div>

<!-- 聊天页 -->
<div class="page" id="page" style="display:none">
  <div class="chat-header">
    <span class="title">🏛️ 炀鉴 · 东亚史录</span>
    <span class="user-info" id="userInfo"></span>
  </div>
  <div class="notice-bar" id="noticeBar">
    <span id="noticeText"></span>
    <button class="notice-close" id="noticeDone">我已发送</button>
  </div>
  <div id="sdk-container"></div>
</div>

<script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
<script>
// ===== 配置 =====
const PROJECT_ID = "7673325558071164955";
const SAT_TOKEN = "sat_7oS29ZulvUD1fiVRhoo4bEz2PWifhtkAUyzY3a5ZnQofcAaab61aoR6A9eyjMJ0p";

// ===== Web SDK 初始化（页面加载即后台启动，聊天区显示时已就绪）=====
cozeWebSDK.init({
  projectId: PROJECT_ID,
  refreshToken: () => Promise.resolve(SAT_TOKEN),
  container: document.getElementById("sdk-container"),
  style: "width: 100%; height: 100%; border: none;"
});

// ===== 身份状态 =====
let stuId = localStorage.getItem("yj_stu_id") || "";
let stuName = localStorage.getItem("yj_stu_name") || "";

const modal = document.getElementById("modal");
const page = document.getElementById("page");

function enterChat() {
  document.getElementById("userInfo").textContent = "👤 " + stuId + " · " + stuName;
  document.getElementById("noticeText").innerHTML =
    "📌 本页每次重新打开都会开始新对话。请先在下方输入框发送：<b>我是" + stuId + "号学生" + stuName + "</b>，等炀鉴回应后再开始提问。";
  modal.style.display = "none";
  page.style.display = "flex";
  sessionStorage.removeItem("yj_notice_done");
  document.getElementById("noticeBar").style.display = "flex";
}

function startChat() {
  const id = document.getElementById("stuId").value.trim();
  const name = document.getElementById("stuName").value.trim().toLowerCase();
  const err = document.getElementById("modalError");

  if (!id || !name) {
    err.textContent = "请填写完整信息";
    err.style.display = "block";
    return;
  }
  if (!/^\d{1,4}$/.test(id)) {
    err.textContent = "编号仅支持数字（1-4位）";
    err.style.display = "block";
    return;
  }
  if (!/^[a-z]{1,6}$/.test(name)) {
    err.textContent = "拼音缩写仅支持小写字母，最长6位";
    err.style.display = "block";
    return;
  }
  stuId = id; stuName = name;
  localStorage.setItem("yj_stu_id", stuId);
  localStorage.setItem("yj_stu_name", stuName);
  enterChat();
}

document.getElementById("startBtn").addEventListener("click", startChat);
document.getElementById("stuName").addEventListener("keydown", e => { if (e.key === "Enter") startChat(); });

document.getElementById("userInfo").addEventListener("click", () => {
  modal.style.display = "flex";
  document.getElementById("stuId").value = stuId;
  document.getElementById("stuName").value = stuName;
  document.getElementById("modalError").style.display = "none";
});

document.getElementById("noticeDone").addEventListener("click", () => {
  document.getElementById("noticeBar").style.display = "none";
});

// 已有身份记录则直接进入（noticeBar 仍会提示重新报编号）
if (stuId && stuName) {
  enterChat();
} else {
  modal.style.display = "flex";
}
</script>
</body>
</html>
